name: Bug report
description: Something in Serra breaks, crashes, regressed, or doesn't work as the README says.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. **Remove tokens, Slack IDs, names, local paths and private repository details** from anything you paste.
        Security problems go to SECURITY.md instead. Ideas go in a feature request.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and didn't find a duplicate.
          required: true
        - label: I removed tokens and private details from everything below.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Daemon / bot in the chat channel, The app, Setup, install or doctor, Background service (launchd), Knowledge pages, Docs, Not sure]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run pnpm bot activate --profile …
        2. Mention the bot in a thread with …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options: [Blocks me completely, Often fails or degrades, Occasional or minor, Cosmetic]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: pnpm run doctor output
      description: Output of `pnpm run doctor --profile …` (redacted).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: Only the relevant lines from the profile's `logs/bot.log` (redacted).
      render: text
  - type: input
    id: version
    attributes:
      label: Serra version or commit
      placeholder: 0.1.0-alpha.1, or git rev-parse --short HEAD
  - type: input
    id: env
    attributes:
      label: macOS, Node and T3 Code versions
      placeholder: macOS 15.5, Node 24.22, T3 Code 0.x
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options: [Foreground (pnpm start), Background service (pnpm bot activate), The app]
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Anything that got you unstuck, if you found something.
