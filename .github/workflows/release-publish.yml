name: "Release: publish"

# Step 2 of a release (docs/releasing.md). Runs on every push to main and does nothing unless that push raised
# package.json's version, which only merging a release PR does. Then it builds the app from that commit, tags it
# v<version> and publishes a GitHub Release with the changelog section as notes and the .dmg attached.
# Run it by hand to retry a release whose tag doesn't exist yet (for example after a failed build).
#
# Signing: without the signing secrets the app is ad-hoc signed, as `pnpm app:package` does today. Once Isac adds
# CSC_LINK and CSC_KEY_PASSWORD (Developer ID Application certificate) and APPLE_API_KEY, APPLE_API_KEY_ID and
# APPLE_API_ISSUER (App Store Connect API key) to the `release` environment, the same job signs and notarizes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: decide
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node scripts/release.ts should-publish > decision.txt
          cat decision.txt
          value() { sed -n "s/^$1=//p" decision.txt; }
          tag=$(value tag)
          publish=$(value publish)
          tagged=false
          if [ -n "$tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then tagged=true; fi
          if [ "$MANUAL" = true ]; then
            if [ -z "$tag" ] || [ "$tag" = v0.0.0 ]; then echo "::error::package.json has no released version."; exit 1; fi
            if [ "$tagged" = true ]; then echo "::error::$tag is already released."; exit 1; fi
            publish=true
          elif [ "$publish" = true ] && [ "$tagged" = true ]; then
            echo "::warning::$tag already exists; not publishing it again."
            publish=false
          fi
          {
            echo "publish=$publish"
            echo "version=$(value version)"
            echo "tag=$tag"
            echo "prerelease=$(value prerelease)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          corepack enable --install-directory "$RUNNER_TEMP/pnpm-bin" pnpm
          echo "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      - name: Build the app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          pnpm app:build
          args=(--mac --publish never)
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "Signing with the Developer ID certificate and notarizing."
            key="$RUNNER_TEMP/notary/AuthKey.p8"
            mkdir -p "$(dirname "$key")"
            (umask 077 && printf '%s' "$APPLE_API_KEY_CONTENT" > "$key")
            export APPLE_API_KEY="$key"
            args+=(-c.mac.identity="Developer ID Application" -c.mac.hardenedRuntime=true -c.mac.notarize=true)
          else
            echo "No signing secrets: building an ad-hoc signed app, as pnpm app:package does."
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          pnpm exec electron-builder "${args[@]}"
          rm -rf "$RUNNER_TEMP/notary"

      - name: Smoke-test the packaged app
        # One run, as in CI's required `app` job: the ⌘K palette flake was a late close event, fixed in #6, and a retry
        # would hide the next real one. One run takes about 40s; this bounds a hung window, not a slow one.
        timeout-minutes: 5
        run: |
          app=$(ls -d release/mac*/Serra.app | head -n 1)
          "$app/Contents/MacOS/Serra" --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [decide, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the tag and the GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.decide.outputs.version }}
      TAG: ${{ needs.decide.outputs.tag }}
      PRERELEASE: ${{ needs.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          (cd release-assets && shasum -a 256 *.dmg > SHA256SUMS && cat SHA256SUMS)
          node scripts/release.ts notes "$VERSION" > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          # Creates the tag on exactly the commit that was built and tested.
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "Serra $TAG" --notes-file notes.md "${flags[@]}"
