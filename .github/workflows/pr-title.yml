name: PR title

# The PR title becomes the squash commit on main, so it must be a Conventional Commit (CONTRIBUTING.md › Naming).
# A `feat` or `fix` PR changes what users get, so it must also add a CHANGELOG.md line (dependency fixes excepted).
# It reads the PR through the API only, so a fork PR's read-only token is enough, and `edited` reruns it when only the
# title changes. GitHub starts no pull_request run for a PR the workflow token opens (the release PR), so
# release-prepare.yml dispatches this workflow on the release branch, and the job checks that branch's open PR.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The PR number on a pull_request run; on a dispatch, the branch, whose open PR gh finds.
          PR: ${{ github.event.pull_request.number || github.ref_name }}
        run: |
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          echo "PR title: $title"
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\(([^)]+)\))?!?: (.+)$'
          if [[ ! "$title" =~ $pattern ]]; then
            echo "::error::The title must be type(scope): subject, with type one of feat, fix, perf, refactor, docs, test, build, ci, chore, revert. Example: fix(palette): ignore late close events"
            exit 1
          fi
          type=${BASH_REMATCH[1]} scope=${BASH_REMATCH[3]} subject=${BASH_REMATCH[4]}
          if [[ "$subject" =~ ^[A-Z] || "$subject" =~ \.$ || ${#subject} -gt 72 ]]; then
            echo "::error::The subject \"$subject\" must start with a lowercase letter, not end with a period, and stay under 72 characters."
            exit 1
          fi
          if [[ ( "$type" == feat || "$type" == fix ) && "$scope" != deps ]]; then
            if ! gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -qx CHANGELOG.md; then
              echo "::error::A $type PR changes what users get: add a line under ## Unreleased in CHANGELOG.md."
              exit 1
            fi
          fi
